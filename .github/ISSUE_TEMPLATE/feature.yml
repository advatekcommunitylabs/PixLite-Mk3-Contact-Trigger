name: Feature proposal
description: Propose a scoped user, protocol, board, or contributor improvement
title: "[Proposal] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the installation or maintenance problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and resource impact
      description: Consider configuration migration, memory, UI size, GPIOs, security, generated sketches, and hardware validation.
    validations:
      required: true

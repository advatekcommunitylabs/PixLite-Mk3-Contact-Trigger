<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Waveshare ESP32-S3-ETH-8DI-8RO input mapping</title>
  <desc id="desc">Eight isolated input terminals DI1 through DI8 map to ESP32 GPIO4 through GPIO11. Field switches connect to the isolated terminal group, not to ESP32 header ground.</desc>
  <style>
    .bg{fill:#202020}.panel{fill:#2c2c2e;stroke:#555;stroke-width:2}.term{fill:#f15a2c}.wire{stroke:#cbc8c5;stroke-width:4}.title{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#cbc8c5}.label{font:700 17px Arial,sans-serif;fill:#fff}.gpio{font:700 15px Arial,sans-serif;fill:#353436}.note{font:700 17px Arial,sans-serif;fill:#f15a2c}
  </style>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="60" y="62">Waveshare industrial 8DI input mapping</text>
  <text class="sub" x="60" y="92">ESP32-S3-ETH-8DI-8RO and ESP32-S3-POE-ETH-8DI-8RO · component/enclosure label view</text>
  <rect class="panel" x="60" y="130" width="1080" height="540" rx="18"/>
  <text class="label" x="110" y="178">ISOLATED FIELD TERMINALS</text>
  <text class="label" x="840" y="178">FIRMWARE SIGNAL</text>
  <g>
    <rect class="term" x="110" y="205" width="150" height="40" rx="6"/><text class="label" x="185" y="231" text-anchor="middle">DI1</text><line class="wire" x1="260" y1="225" x2="840" y2="225"/><rect x="840" y="205" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="231" text-anchor="middle">GPIO4</text>
    <rect class="term" x="110" y="252" width="150" height="40" rx="6"/><text class="label" x="185" y="278" text-anchor="middle">DI2</text><line class="wire" x1="260" y1="272" x2="840" y2="272"/><rect x="840" y="252" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="278" text-anchor="middle">GPIO5</text>
    <rect class="term" x="110" y="299" width="150" height="40" rx="6"/><text class="label" x="185" y="325" text-anchor="middle">DI3</text><line class="wire" x1="260" y1="319" x2="840" y2="319"/><rect x="840" y="299" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="325" text-anchor="middle">GPIO6</text>
    <rect class="term" x="110" y="346" width="150" height="40" rx="6"/><text class="label" x="185" y="372" text-anchor="middle">DI4</text><line class="wire" x1="260" y1="366" x2="840" y2="366"/><rect x="840" y="346" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="372" text-anchor="middle">GPIO7</text>
    <rect class="term" x="110" y="393" width="150" height="40" rx="6"/><text class="label" x="185" y="419" text-anchor="middle">DI5</text><line class="wire" x1="260" y1="413" x2="840" y2="413"/><rect x="840" y="393" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="419" text-anchor="middle">GPIO8</text>
    <rect class="term" x="110" y="440" width="150" height="40" rx="6"/><text class="label" x="185" y="466" text-anchor="middle">DI6</text><line class="wire" x1="260" y1="460" x2="840" y2="460"/><rect x="840" y="440" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="466" text-anchor="middle">GPIO9</text>
    <rect class="term" x="110" y="487" width="150" height="40" rx="6"/><text class="label" x="185" y="513" text-anchor="middle">DI7</text><line class="wire" x1="260" y1="507" x2="840" y2="507"/><rect x="840" y="487" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="513" text-anchor="middle">GPIO10</text>
    <rect class="term" x="110" y="534" width="150" height="40" rx="6"/><text class="label" x="185" y="560" text-anchor="middle">DI8</text><line class="wire" x1="260" y1="554" x2="840" y2="554"/><rect x="840" y="534" width="150" height="40" rx="6" fill="#e7e3df"/><text class="gpio" x="915" y="560" text-anchor="middle">GPIO11</text>
  </g>
  <text class="note" x="60" y="620">Wire buttons within the isolated DI terminal group. Do not use an ESP32 GPIO header or ESP32 GND for field switches.</text>
  <text class="sub" x="60" y="650">Verify the enclosure labels and Waveshare passive/active input diagram before applying external voltage.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dry-contact wiring for the Waveshare industrial PoE board</title>
  <desc id="desc">Eight optional dry-contact switches connect between the shared isolated COM terminal and DI1 through DI8. DGND, relay terminals, ESP32 ground and protective earth are not used.</desc>
  <style>
    .bg{fill:#202020}.panel{fill:#2c2c2e;stroke:#555;stroke-width:2}.term{fill:#f15a2c}.unused{fill:#58585a}
    .wire{fill:none;stroke:#e6e3df;stroke-width:5}.pair{fill:none;stroke:#7abf45;stroke-width:4;stroke-dasharray:9 7}
    .contact{stroke:#f15a2c;stroke-width:6;stroke-linecap:round}.title{font:700 32px Arial,sans-serif;fill:#fff}
    .sub{font:17px Arial,sans-serif;fill:#cbc8c5}.label{font:700 17px Arial,sans-serif;fill:#fff}
    .note{font:700 18px Arial,sans-serif;fill:#f15a2c}.ok{font:700 18px Arial,sans-serif;fill:#7abf45}
  </style>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="54" y="58">Passive switches: COM to DI1–DI8</text>
  <text class="sub" x="54" y="88">The PoE cable powers and networks the controller. Each field button uses only the isolated digital-input terminal group.</text>

  <rect class="panel" x="54" y="120" width="1092" height="500" rx="18"/>
  <text class="label" x="88" y="160">WAVESHARE ISOLATED INPUT TERMINALS</text>

  <g transform="translate(88 188)">
    <rect class="term" width="92" height="54" rx="6"/><text class="label" x="46" y="34" text-anchor="middle">COM</text>
    <rect class="unused" x="100" width="92" height="54" rx="6"/><text class="label" x="146" y="34" text-anchor="middle">DGND</text>
    <g transform="translate(200)">
      <rect class="term" width="92" height="54" rx="6"/><text class="label" x="46" y="34" text-anchor="middle">DI1</text>
      <rect class="term" x="100" width="92" height="54" rx="6"/><text class="label" x="146" y="34" text-anchor="middle">DI2</text>
      <rect class="term" x="200" width="92" height="54" rx="6"/><text class="label" x="246" y="34" text-anchor="middle">DI3</text>
      <rect class="term" x="300" width="92" height="54" rx="6"/><text class="label" x="346" y="34" text-anchor="middle">DI4</text>
      <rect class="term" x="400" width="92" height="54" rx="6"/><text class="label" x="446" y="34" text-anchor="middle">DI5</text>
      <rect class="term" x="500" width="92" height="54" rx="6"/><text class="label" x="546" y="34" text-anchor="middle">DI6</text>
      <rect class="term" x="600" width="92" height="54" rx="6"/><text class="label" x="646" y="34" text-anchor="middle">DI7</text>
      <rect class="term" x="700" width="92" height="54" rx="6"/><text class="label" x="746" y="34" text-anchor="middle">DI8</text>
    </g>
  </g>

  <!-- COM common bus -->
  <path class="wire" d="M134 242 V540 H1080"/>
  <text class="ok" x="88" y="580">Shared COM return</text>

  <!-- Eight normally-open switches. Each closes a DI terminal to COM. -->
  <g>
    <path class="wire" d="M334 242 V372"/><line class="contact" x1="318" y1="372" x2="350" y2="372"/><line class="contact" x1="318" y1="420" x2="350" y2="420"/><line class="contact" x1="320" y1="372" x2="347" y2="410"/><path class="wire" d="M334 420 V540"/>
    <path class="wire" d="M434 242 V372"/><line class="contact" x1="418" y1="372" x2="450" y2="372"/><line class="contact" x1="418" y1="420" x2="450" y2="420"/><line class="contact" x1="420" y1="372" x2="447" y2="410"/><path class="wire" d="M434 420 V540"/>
    <path class="wire" d="M534 242 V372"/><line class="contact" x1="518" y1="372" x2="550" y2="372"/><line class="contact" x1="518" y1="420" x2="550" y2="420"/><line class="contact" x1="520" y1="372" x2="547" y2="410"/><path class="wire" d="M534 420 V540"/>
    <path class="wire" d="M634 242 V372"/><line class="contact" x1="618" y1="372" x2="650" y2="372"/><line class="contact" x1="618" y1="420" x2="650" y2="420"/><line class="contact" x1="620" y1="372" x2="647" y2="410"/><path class="wire" d="M634 420 V540"/>
    <path class="wire" d="M734 242 V372"/><line class="contact" x1="718" y1="372" x2="750" y2="372"/><line class="contact" x1="718" y1="420" x2="750" y2="420"/><line class="contact" x1="720" y1="372" x2="747" y2="410"/><path class="wire" d="M734 420 V540"/>
    <path class="wire" d="M834 242 V372"/><line class="contact" x1="818" y1="372" x2="850" y2="372"/><line class="contact" x1="818" y1="420" x2="850" y2="420"/><line class="contact" x1="820" y1="372" x2="847" y2="410"/><path class="wire" d="M834 420 V540"/>
    <path class="wire" d="M934 242 V372"/><line class="contact" x1="918" y1="372" x2="950" y2="372"/><line class="contact" x1="918" y1="420" x2="950" y2="420"/><line class="contact" x1="920" y1="372" x2="947" y2="410"/><path class="wire" d="M934 420 V540"/>
    <path class="wire" d="M1034 242 V372"/><line class="contact" x1="1018" y1="372" x2="1050" y2="372"/><line class="contact" x1="1018" y1="420" x2="1050" y2="420"/><line class="contact" x1="1020" y1="372" x2="1047" y2="410"/><path class="wire" d="M1034 420 V540"/>
  </g>

  <path class="pair" d="M300 274 C270 310 268 474 302 518"/>
  <text class="ok" x="88" y="655">Cable tip: use one twisted pair per remote switch — one conductor to DIx, the other to COM.</text>
  <text class="note" x="88" y="690">Do not use DGND/DCGND, relay COM, ESP32 GND, protective earth, or an external voltage for passive dry contacts.</text>
  <text class="sub" x="88" y="722">The eight relay terminals on the opposite side are unused by Advatek Trigger.</text>
</svg>

    <rect x="400" y="690" width="110" height="28" rx="9" fill="#4A4A4C"/>
    <text x="455" y="710" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">GND</text>
    <text x="950" y="793" text-anchor="middle" font-size="17" fill="#CBC8C5">Normally open: closing the button connects its GPIO to GND</text>
  </g>
  <path d="M1380 730 V748 M1360 748 H1400 M1367 756 H1393 M1374 764 H1386" stroke="#CBC8C5" stroke-width="3"/>
  <rect x="58" y="818" width="1484" height="52" rx="14" fill="#F15A2C"/>
  <text x="800" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1F1F20">Bench or same-enclosure wiring only · Never apply 5 V, 12 V, 24 V or PoE to a GPIO</text>

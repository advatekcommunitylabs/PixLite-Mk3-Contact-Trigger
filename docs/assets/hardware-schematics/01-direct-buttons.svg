<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Waveshare ESP32-S3-ETH with up to eight dry-contact buttons for bench testing</title>
  <rect width="1600" height="900" fill="#1F1F20"/>
  <rect width="1600" height="116" fill="#353436"/>
  <rect y="112" width="1600" height="4" fill="#F15A2C"/>
  <text x="58" y="43" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F15A2C">ADVATEK COMMUNITY LABS</text>
  <text x="58" y="88" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">Up to eight dry-contact buttons for bench testing</text>
  <text x="1540" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#CBC8C5">DIRECT CONTACT · EDITABLE DIAGRAM</text>
  <text x="1000" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#CBC8C5">One button = one 2-core cable (twisted pair): GPIO signal + GND return</text>
  <rect x="70" y="170" width="440" height="580" rx="22" fill="#171719" stroke="#78736F" stroke-width="3"/>
  <rect x="70" y="170" width="10" height="580" fill="#F15A2C"/>
  <rect x="120" y="202" width="280" height="64" rx="14" fill="#323234" stroke="#78736F" stroke-width="2"/>
  <text x="260" y="242" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">PoE module</text>
  <text x="250" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Waveshare<tspan x="250" dy="38">ESP32-S3-ETH</tspan></text>
  <text x="250" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#CBC8C5">W5500 Ethernet<tspan x="250" dy="25">16 MB flash · 8 MB PSRAM</tspan></text>
  <rect x="180" y="650" width="140" height="54" rx="10" fill="#A9A9AB" stroke="#FFFFFF" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">

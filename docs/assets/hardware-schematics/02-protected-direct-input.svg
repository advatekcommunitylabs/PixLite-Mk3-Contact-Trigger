<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
  <title>Protected fixed indoor button cable for the Waveshare ESP32-S3-ETH</title>
  <rect width="1600" height="900" fill="#1F1F20"/>
  <rect width="1600" height="116" fill="#353436"/>
  <rect y="112" width="1600" height="4" fill="#F15A2C"/>
  <text x="58" y="43" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F15A2C"><tspan x="58" dy="0">ADVATEK LABS</tspan></text>
  <text x="58" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF"><tspan x="58" dy="0">Add protection for a fixed indoor button cable</tspan></text>
  <text x="1540" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#CBC8C5"><tspan x="1540" dy="0">ONE CHANNEL</tspan></text>
  <rect x="70" y="220" width="330" height="490" rx="22" fill="#171719" stroke="#78736F" stroke-width="3"/><text x="235" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF"><tspan x="235" dy="0">Waveshare</tspan><tspan x="235" dy="33.6">ESP32-S3-ETH</tspan></text><text x="410" y="390" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#F15A2C"><tspan x="410" dy="0">GPIO16</tspan></text><line x1="400" y1="410" x2="550" y2="410" stroke="#F15A2C" stroke-width="5"/><circle cx="550" cy="410" r="12" fill="#F15A2C" stroke="#FFFFFF" stroke-width="3"/><line x1="550" y1="410" x2="760" y2="410" stroke="#F15A2C" stroke-width="5"/><rect x="760" y="376" width="180" height="68" rx="16" fill="#323234" stroke="#78736F" stroke-width="2"/><text x="850" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF"><tspan x="850" dy="0">1 kΩ series</tspan></text><line x1="940" y1="410" x2="1050" y2="410" stroke="#F15A2C" stroke-width="5"/><rect x="1050" y="350" width="180" height="120" rx="16" fill="#332722" stroke="#F15A2C" stroke-width="2"/><text x="1140" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF"><tspan x="1140" dy="0">Field terminal</tspan></text><text x="1140" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#F15A2C"><tspan x="1140" dy="0">+ TVS</tspan></text><line x1="1230" y1="410" x2="1320" y2="410" stroke="#F15A2C" stroke-width="5"/><circle cx="1320" cy="410" r="10" fill="#1F1F20" stroke="#FFFFFF" stroke-width="3"/><circle cx="1460" cy="410" r="10" fill="#1F1F20" stroke="#FFFFFF" stroke-width="3"/><line x1="1330" y1="406" x2="1447" y2="373" stroke="#F15A2C" stroke-width="7"/><text x="1390" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF"><tspan x="1390" dy="0">Dry-contact button</tspan></text><line x1="1460" y1="420" x2="1460" y2="680" stroke="#CBC8C5" stroke-width="5"/><line x1="1460" y1="680" x2="400" y2="680" stroke="#CBC8C5" stroke-width="5"/><rect x="475" y="230" width="150" height="64" rx="16" fill="#323234" stroke="#78736F" stroke-width="2"/><text x="550" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="550" dy="0">10 kΩ to 3V3</tspan></text><line x1="550" y1="294" x2="550" y2="398" stroke="#CBC8C5" stroke-width="4"/><rect x="475" y="520" width="150" height="70" rx="16" fill="#323234" stroke="#78736F" stroke-width="2"/><text x="550" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="550" dy="0">100 nF</tspan></text><text x="550" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#CBC8C5"><tspan x="550" dy="0">to GND</tspan></text><line x1="550" y1="422" x2="550" y2="520" stroke="#CBC8C5" stroke-width="4"/><rect x="650" y="520" width="190" height="70" rx="16" fill="#323234" stroke="#78736F" stroke-width="2"/><text x="745" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF"><tspan x="745" dy="0">1N5817 clamps</tspan></text><text x="745" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#CBC8C5"><tspan x="745" dy="0">3V3 + GND</tspan></text><rect x="58" y="818" width="1484" height="52" rx="14" fill="#E7E3DF" stroke="none" stroke-width="2"/><text x="800" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#353436"><tspan x="800" dy="0">Fixed indoor props only · This circuit still shares ESP32 ground</tspan></text>
</svg>

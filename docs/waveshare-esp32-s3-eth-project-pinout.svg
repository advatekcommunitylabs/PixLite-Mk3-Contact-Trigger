<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Waveshare ESP32-S3-ETH project pinout for Advatek Community Labs Contact Trigger</title>
  <desc id="desc">Front view of the Waveshare ESP32-S3-ETH with the USB and PoE module end at the top. GPIO 1, 2, 15, 16, 18, 38, 39, and 40 are highlighted as contact inputs. Ground pins are also highlighted.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 19px Arial, Helvetica, sans-serif; fill: #cbc9c7; }
      .heading { font: 700 22px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #e7e5e3; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #b8b5b2; }
      .pin { font: 700 16px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .pinNo { font: 700 12px Arial, Helvetica, sans-serif; fill: #d8d5d2; }
      .note { font: 700 17px Arial, Helvetica, sans-serif; fill: #353436; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1400" height="980" fill="#1f1f20"/>
  <rect x="0" y="0" width="1400" height="112" fill="#353436"/>
  <rect x="0" y="108" width="1400" height="4" fill="#f15a2c"/>
  <text x="56" y="52" class="title">Waveshare ESP32-S3-ETH</text>
  <text x="56" y="84" class="subtitle">Advatek Community Labs Contact Trigger | front view | project pins only | optional PoE module shown</text>

  <!-- Orientation and project legend -->
  <g transform="translate(56 150)">
    <rect width="336" height="178" rx="14" fill="#29292a" stroke="#4b4948"/>
    <text x="22" y="34" class="heading">How to hold the board</text>
    <text x="22" y="70" class="body">USB-C and PoE module at the top.</text>
    <text x="22" y="98" class="body">MicroSD slot and antenna at bottom.</text>
    <circle cx="29" cy="133" r="9" fill="#f15a2c"/>
    <text x="48" y="139" class="body">Approved contact GPIO</text>
    <circle cx="29" cy="159" r="9" fill="#4a4a4c"/>
    <text x="48" y="165" class="body">Board GND for direct dry contacts</text>
  </g>

  <!-- Board body -->
  <g filter="url(#shadow)">
    <rect x="480" y="150" width="440" height="704" rx="26" fill="#19191a" stroke="#777370" stroke-width="3"/>
    <rect x="589" y="128" width="222" height="68" rx="10" fill="#b5b5b6" stroke="#dedede" stroke-width="3"/>
    <rect x="624" y="138" width="152" height="45" rx="5" fill="#5c5d5f"/>
    <text x="700" y="102" text-anchor="middle" class="small">USB-C / PoE MODULE END</text>
    <rect x="548" y="218" width="304" height="82" rx="12" fill="#313133" stroke="#65615e" stroke-dasharray="7 5"/>
    <text x="700" y="250" text-anchor="middle" class="heading">PoE module</text>
    <text x="700" y="278" text-anchor="middle" class="small">power only · no GPIO connection</text>
    <rect x="585" y="360" width="230" height="252" rx="18" fill="#252527" stroke="#4b4948" stroke-width="2"/>
    <text x="700" y="456" text-anchor="middle" class="heading">ESP32-S3R8</text>
    <text x="700" y="486" text-anchor="middle" class="small">16 MB flash · 8 MB PSRAM</text>
    <text x="700" y="534" text-anchor="middle" class="small">Do not connect the camera</text>
    <text x="700" y="558" text-anchor="middle" class="small">or microSD card in this project</text>
    <rect x="610" y="680" width="180" height="82" rx="8" fill="#c9c9ca" stroke="#f3f3f3" stroke-width="2"/>
    <rect x="640" y="697" width="120" height="48" rx="4" fill="#78797b"/>
    <path d="M585 814 Q700 740 815 814" fill="none" stroke="#d9d6d2" stroke-width="5" stroke-dasharray="9 9"/>
    <text x="700" y="870" text-anchor="middle" class="small">ANTENNA / MICROSD END</text>
  </g>

  <!-- Header rails -->
  <rect x="446" y="326" width="24" height="444" rx="10" fill="#ad8b42"/>
  <rect x="930" y="326" width="24" height="444" rx="10" fill="#ad8b42"/>

  <!-- Left project pins: use the GPIO/GND names printed on the board -->
  <g>
    <line x1="458" y1="387" x2="410" y2="387" stroke="#4a4a4c" stroke-width="4"/>
    <circle cx="458" cy="387" r="10" fill="#4a4a4c" stroke="#d8d5d2" stroke-width="2"/>
    <rect x="188" y="365" width="222" height="44" rx="9" fill="#4a4a4c"/>
    <text x="209" y="393" class="pin">GND</text>

    <line x1="458" y1="432" x2="410" y2="432" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="458" cy="432" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="188" y="410" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="209" y="438" class="pin">GPIO16</text>

    <line x1="458" y1="477" x2="410" y2="477" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="458" cy="477" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="188" y="455" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="209" y="483" class="pin">GPIO18</text>

    <line x1="458" y1="522" x2="410" y2="522" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="458" cy="522" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="188" y="500" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="209" y="528" class="pin">GPIO15</text>

    <line x1="458" y1="567" x2="410" y2="567" stroke="#4a4a4c" stroke-width="4"/>
    <circle cx="458" cy="567" r="10" fill="#4a4a4c" stroke="#d8d5d2" stroke-width="2"/>
    <rect x="188" y="545" width="222" height="44" rx="9" fill="#4a4a4c"/>
    <text x="209" y="573" class="pin">GND</text>

    <line x1="458" y1="612" x2="410" y2="612" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="458" cy="612" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="188" y="590" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="209" y="618" class="pin">GPIO2</text>

    <line x1="458" y1="657" x2="410" y2="657" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="458" cy="657" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="188" y="635" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="209" y="663" class="pin">GPIO1</text>

    <line x1="458" y1="702" x2="410" y2="702" stroke="#4a4a4c" stroke-width="4"/>
    <circle cx="458" cy="702" r="10" fill="#4a4a4c" stroke="#d8d5d2" stroke-width="2"/>
    <rect x="188" y="680" width="222" height="44" rx="9" fill="#4a4a4c"/>
    <text x="209" y="708" class="pin">GND</text>
  </g>

  <!-- Right project pins -->
  <g>
    <line x1="942" y1="432" x2="990" y2="432" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="942" cy="432" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="990" y="410" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="1011" y="438" class="pin">GPIO40</text>

    <line x1="942" y1="477" x2="990" y2="477" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="942" cy="477" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="990" y="455" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="1011" y="483" class="pin">GPIO39</text>

    <line x1="942" y1="522" x2="990" y2="522" stroke="#4a4a4c" stroke-width="4"/>
    <circle cx="942" cy="522" r="10" fill="#4a4a4c" stroke="#d8d5d2" stroke-width="2"/>
    <rect x="990" y="500" width="222" height="44" rx="9" fill="#4a4a4c"/>
    <text x="1011" y="528" class="pin">GND</text>

    <line x1="942" y1="567" x2="990" y2="567" stroke="#f15a2c" stroke-width="4"/>
    <circle cx="942" cy="567" r="10" fill="#f15a2c" stroke="#ffffff" stroke-width="2"/>
    <rect x="990" y="545" width="222" height="44" rx="9" fill="#f15a2c"/>
    <text x="1011" y="573" class="pin">GPIO38</text>

    <line x1="942" y1="612" x2="990" y2="612" stroke="#4a4a4c" stroke-width="4"/>
    <circle cx="942" cy="612" r="10" fill="#4a4a4c" stroke="#d8d5d2" stroke-width="2"/>
    <rect x="990" y="590" width="222" height="44" rx="9" fill="#4a4a4c"/>
    <text x="1011" y="618" class="pin">GND</text>
  </g>

  <!-- Wiring reminder -->
  <g transform="translate(56 882)">
    <rect width="1288" height="66" rx="12" fill="#f15a2c"/>
    <text x="28" y="42" class="note">DIRECT BENCH TEST: selected GPIO ─── volt-free switch ─── GND</text>
    <text x="832" y="42" class="note">Never apply external voltage to a GPIO.</text>
  </g>
</svg>

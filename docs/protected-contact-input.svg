<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Protected dry-contact input for the Waveshare ESP32-S3-ETH</title>
  <desc id="description">One repeatable input channel with a dry contact, bidirectional TVS, one kilohm series resistor, ten kilohm pull-up, one hundred nanofarad filter, and Schottky clamps.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f5; }
      .panel { fill: #ffffff; stroke: #353436; stroke-width: 2; }
      .wire { fill: none; stroke: #353436; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .component { fill: #ffffff; stroke: #353436; stroke-width: 3; }
      .orange { fill: #f15a2c; }
      .orange-line { fill: none; stroke: #f15a2c; stroke-width: 5; }
      .muted { fill: #69686a; }
      .title { font: 700 30px Arial, sans-serif; fill: #222123; }
      .heading { font: 700 20px Arial, sans-serif; fill: #222123; }
      .label { font: 600 17px Arial, sans-serif; fill: #353436; }
      .small { font: 15px Arial, sans-serif; fill: #69686a; }
      .tiny { font: 13px Arial, sans-serif; fill: #69686a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="orange"/>
    </marker>
  </defs>

  <rect width="1200" height="720" class="bg"/>
  <text x="52" y="55" class="title">Basic protected dry-contact input</text>
  <text x="52" y="83" class="small">Repeat this channel for every switch. PoE powers the Waveshare board; no 48 V wiring enters this circuit.</text>

  <rect x="42" y="112" width="1116" height="505" rx="14" class="panel"/>
  <line x1="460" y1="112" x2="460" y2="617" stroke="#d3d2d0" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="75" y="150" class="heading">FIELD / SWITCH SIDE</text>
  <text x="493" y="150" class="heading">ESP32 SIDE</text>

  <!-- Dry contact and input terminal -->
  <circle cx="112" cy="283" r="9" class="orange"/>
  <circle cx="112" cy="461" r="9" class="orange"/>
  <text x="74" y="255" class="label">IN</text>
  <text x="64" y="501" class="label">COM</text>
  <line x1="112" y1="283" x2="112" y2="340" class="wire"/>
  <line x1="112" y1="461" x2="112" y2="404" class="wire"/>
  <line x1="112" y1="340" x2="185" y2="384" class="wire"/>
  <line x1="112" y1="404" x2="112" y2="384" class="wire"/>
  <circle cx="112" cy="384" r="6" fill="#353436"/>
  <text x="72" y="367" class="small">dry contact</text>
  <text x="56" y="531" class="tiny">Short twisted pair</text>

  <!-- TVS -->
  <line x1="112" y1="283" x2="265" y2="283" class="wire"/>
  <line x1="225" y1="283" x2="225" y2="330" class="wire"/>
  <rect x="194" y="330" width="62" height="66" rx="6" class="component"/>
  <path d="M205 350 L245 376 M245 350 L205 376" class="wire"/>
  <line x1="225" y1="396" x2="225" y2="461" class="wire"/>
  <line x1="112" y1="461" x2="515" y2="461" class="wire"/>
  <text x="270" y="354" class="label">TVS1</text>
  <text x="270" y="378" class="small">SA5.0CA</text>
  <text x="270" y="401" class="tiny">bidirectional</text>

  <!-- Series resistor -->
  <line x1="265" y1="283" x2="330" y2="283" class="wire"/>
  <rect x="330" y="261" width="130" height="44" rx="7" class="component"/>
  <text x="352" y="290" class="label">R1 · 1 kΩ</text>
  <line x1="460" y1="283" x2="718" y2="283" class="wire"/>
  <circle cx="718" cy="283" r="7" class="orange"/>
  <text x="630" y="266" class="small">GPIO node</text>

  <!-- Pullup -->
  <line x1="718" y1="283" x2="718" y2="224" class="wire"/>
  <rect x="667" y="180" width="102" height="44" rx="7" class="component"/>
  <text x="681" y="209" class="label">10 kΩ</text>
  <line x1="718" y1="180" x2="718" y2="163" class="wire"/>
  <text x="691" y="155" class="label">3V3</text>

  <!-- Filter capacitor -->
  <line x1="718" y1="283" x2="718" y2="361" class="wire"/>
  <line x1="680" y1="361" x2="756" y2="361" class="wire"/>
  <line x1="680" y1="377" x2="756" y2="377" class="wire"/>
  <line x1="718" y1="377" x2="718" y2="461" class="wire"/>
  <text x="768" y="366" class="label">C1 · 100 nF</text>
  <text x="768" y="390" class="small">noise filter</text>

  <!-- GPIO arrow -->
  <line x1="718" y1="283" x2="1082" y2="283" class="orange-line" marker-end="url(#arrow)"/>
  <text x="953" y="258" class="heading">TO GPIO</text>

  <!-- Clamp diode labels -->
  <rect x="840" y="164" width="200" height="61" rx="8" class="component"/>
  <text x="858" y="190" class="label">D1 · 1N5817</text>
  <text x="858" y="213" class="tiny">anode GPIO → band 3V3</text>
  <line x1="940" y1="225" x2="940" y2="283" class="wire"/>

  <rect x="840" y="342" width="200" height="61" rx="8" class="component"/>
  <text x="858" y="368" class="label">D2 · 1N5817</text>
  <text x="858" y="391" class="tiny">anode GND → band GPIO</text>
  <line x1="940" y1="283" x2="940" y2="342" class="wire"/>
  <line x1="940" y1="403" x2="940" y2="461" class="wire"/>

  <!-- Ground -->
  <line x1="515" y1="461" x2="1082" y2="461" class="wire"/>
  <line x1="1070" y1="461" x2="1070" y2="483" class="wire"/>
  <line x1="1040" y1="483" x2="1100" y2="483" class="wire"/>
  <line x1="1048" y1="494" x2="1092" y2="494" class="wire"/>
  <line x1="1058" y1="505" x2="1082" y2="505" class="wire"/>
  <text x="1000" y="535" class="label">ESP GND</text>

  <!-- Footer notes -->
  <rect x="42" y="638" width="1116" height="55" rx="10" fill="#353436"/>
  <text x="65" y="672" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    DRY CONTACTS ONLY · COM IS ESP32 GROUND · NEVER CONNECT THIS BOARD TO 48 V POE, MAINS, OR A POWERED CONTROL SIGNAL
  </text>
</svg>

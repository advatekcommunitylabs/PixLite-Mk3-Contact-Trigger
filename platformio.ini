[platformio]
default_envs = waveshare_esp32_s3_eth, waveshare_esp32_s3_eth_8di_8ro
src_dir = firmware/AdvatekTrigger

[env:waveshare_esp32_s3_eth]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DADVATEK_BOARD_WAVESHARE_ESP32_S3_ETH=1
monitor_speed = 115200

[env:waveshare_esp32_s3_eth_8di_8ro]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DADVATEK_BOARD_WAVESHARE_ESP32_S3_ETH_8DI_8RO=1
monitor_speed = 115200
